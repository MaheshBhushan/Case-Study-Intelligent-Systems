[project]
name = "moulding-sim"
version = "0.1.0"
description = "Discrete-event simulation and AI scheduling of a medical injection-moulding line (Gerresheimer Pfreimd reference case)"
readme = "README.md"
authors = [
    { name = "Mahesh Koduri", email = "Mkoduri73@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "simpy>=4.1.2",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
